<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Replit banner: load only on Replit hosts so local/Cursor preview is not blocked by a third-party script -->
    <script type="module">
      const h = typeof location !== "undefined" ? location.hostname : "";
      if (/replit\.dev$|\.repl\.co$|replit\.com$/i.test(h)) {
        const s = document.createElement("script");
        s.src = "https://replit.com/public/js/replit-dev-banner.js";
        s.async = true;
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
