# Lint, typecheck, unit tests, and production build on every push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: npm run ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Avoid `prepare` → `husky` failing on CI runners (no hook install needed).
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI (check, lint, test, build)
        run: npm run ci
