# Railway: connect repo `dhazehtx/pup-connect-finds`, add Postgres + env vars in the dashboard.
# This file overrides service build/start when Railway deploys from GitHub.
# Secrets (DATABASE_URL, Stripe, Supabase, SESSION_SECRET, BASE_URL, …) are NOT stored here.

[build]
# Railpack already runs install (`npm ci` / equivalent) *before* this command.
# Running `npm ci` again here caused EBUSY removing `node_modules/.vite` (double install).
# `.npmrc` (legacy-peer-deps) still applies to Railpack’s install step.
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 120
