# Railway: connect repo `dhazehtx/pup-connect-finds`, add Postgres + env vars in the dashboard.
# This file overrides service build/start when Railway deploys from GitHub.
# Secrets (DATABASE_URL, Stripe, Supabase, SESSION_SECRET, BASE_URL, …) are NOT stored here.

[build]
# HUSKY=0: skip `prepare` → husky during install on the builder (no `.git` hooks needed).
# `.npmrc` in repo pins legacy peer resolution so `npm ci` matches lockfile across Node 20–22 + npm 10/11.
buildCommand = "HUSKY=0 npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
